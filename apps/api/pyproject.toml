[project]
name = "tcg-api"
version = "0.1.0"
requires-python = ">=3.14,<3.16"
dependencies = [
    "tcg-core",
    "tcg-persistence",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.11",
    "starlette>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcg_api"]

[tool.uv.sources]
tcg-core = { workspace = true }
tcg-persistence = { workspace = true }
