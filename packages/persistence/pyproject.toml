[project]
name = "tcg-persistence"
version = "0.1.0"
requires-python = ">=3.14,<3.16"
dependencies = [
    "tcg-core",
    "sqlalchemy>=2.0",
    "alembic>=1.15",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcg_persistence"]

[tool.uv.sources]
tcg-core = { workspace = true }

[project.scripts]
tcg-migrate-images = "tcg_persistence.migrate_images:main"
