[project]
name = "tcg-scraping"
version = "0.1.0"
requires-python = ">=3.14,<3.16"
dependencies = [
    "tcg-core",
    "tcg-persistence",
    "scrapy>=2.20",
    "twisted>=25.5",
    "scrapy-playwright>=0.0.44",
    "playwright>=1.51",
    "pillow>=11.2",
    "filelock>=3.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcg_scraping"]

[tool.uv.sources]
tcg-core = { workspace = true }
tcg-persistence = { workspace = true }

[project.scripts]
tcg-scrape = "tcg_scraping.cli.scrape:main"
tcg-worker = "tcg_scraping.worker:main"
tcg-reindex = "tcg_scraping.cli.reindex:main"
